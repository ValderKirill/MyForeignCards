<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>MyForeignCards</title>
</head>
<body>
    <h2>Dictionary</h2>
    <div>
        <p>
            Добавить категорию:<br />
            <input id="newCategory" />
            <button id="addCategoryBtn">Добавить категорию</button>
        </p>
        <p>
            Категория:<br />
            <select id="category">
                <option value="">Без категории</option>
            </select>
            <button id="deleteCategory">Удалить категорию</button>
        </p>
        <input type="hidden" id="wordId" />
        <p>
            Слово:<br />
            <input id="text" />
        </p>
        <p>
            Перевод:<br />
            <input id="translation" />
        </p>
        <p>
            <button id="saveBtn">Сохранить</button>
            <button id="resetBtn">Сбросить</button>
        </p>
    </div>
    <p>
        Категория:<br />
        <select id="tableCategory">
            <option value="">Все категории</option>
        </select>
    </p>
    <table id="WordsTable">
        <thead><tr><th>Слово</th><th>Перевод</th><th></th></tr></thead>
        <tbody>
        </tbody>
    </table>

    <script src="/js/words.js"></script>
    <script src="/js/categories.js"></script>
</body>
</html>
